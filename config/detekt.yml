config:
  excludes:
    - '**/test/**'
    - '**/androidTest/**'
    - '**/commonTest/**'
    - '**/jvmTest/**'
    - '**/jsTest/**'
    - '**/iosTest/**'

console-reports: []

comments: all

complexity:
  active: true
  AbsolutePath:
    active: false
  ComplexCondition:
    active: true
    threshold: 4
  ComplexInterface:
    active: false
    threshold: 12
  CyclomaticComplexity:
    active: true
    threshold: 20
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    threshold: 6
  NestedBlockDepth:
    active: true
    threshold: 4
  StringLiteralDuplicate:
    active: true
    threshold: 3
  TooManyFunctions:
    active: true
    threshold: 11

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: false
  RedundantSuspendModifier:
    active: false

empty-blocks:
  active: true
  EmptyCatchBlock:
